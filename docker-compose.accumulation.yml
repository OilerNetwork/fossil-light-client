services:
  build-mmr:
    image: nethermind.jfrog.io/kyoto-oiler-oci-local-dev/fossil-build-mmr:latest
    container_name: fossil-build-mmr
    volumes:
      - ./:/app
    entrypoint: []
    command: >
      /bin/sh -c "
      build-mmr --env-file ${ENV_FILE:-/app/.env.docker}
      ${NUM_BATCHES:+--num-batches ${NUM_BATCHES}}
      ${START_BLOCK:+--start-block ${START_BLOCK}}
      ${RESUME:+--resume}
      "
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - ETHEREUM_RPC_URL=http://anvil:8545
      - BONSAI_API_URL=${BONSAI_API_URL:-https://api.bonsai.xyz/}
      - SQLX_SLOW_STATEMENTS_THRESHOLD=0
    env_file:
      - ${ENV_FILE:-.env}
    networks:
      - fossil-network

networks:
  fossil-network:
    external: true
    name: fossil-network
