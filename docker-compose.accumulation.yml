services:
  build-mmr:
    # image: ametelnethermind/fossil-build-mmr:latest
    image: fossil-build-mmr
    container_name: fossil-build-mmr
    volumes:
      - ./:/app
    entrypoint: []
    command: >
      /bin/sh -c "
      if [ -n \"${ENV_FILE:-}\" ] && [ -f \"${ENV_FILE}\" ]; then
        build-mmr --env-file ${ENV_FILE}
        ${NUM_BATCHES:+--num-batches ${NUM_BATCHES}}
        ${BATCH_SIZE:+--batch-size ${BATCH_SIZE}}
        ${START_BLOCK:+--start-block ${START_BLOCK}}
        ${RESUME:+--resume}
      elif [ -f \"/app/.env.docker\" ]; then
        build-mmr --env-file /app/.env.docker
        ${NUM_BATCHES:+--num-batches ${NUM_BATCHES}}
        ${BATCH_SIZE:+--batch-size ${BATCH_SIZE}}
        ${START_BLOCK:+--start-block ${START_BLOCK}}
        ${RESUME:+--resume}
      else
        build-mmr
        ${NUM_BATCHES:+--num-batches ${NUM_BATCHES}}
        ${BATCH_SIZE:+--batch-size ${BATCH_SIZE}}
        ${START_BLOCK:+--start-block ${START_BLOCK}}
        ${RESUME:+--resume}
      fi
      "
    environment:
      - ETHEREUM_RPC_URL=http://anvil:8545
      - BONSAI_API_URL=${BONSAI_API_URL:-https://api.bonsai.xyz/}
      - SQLX_SLOW_STATEMENTS_THRESHOLD=0
    env_file:
      - ${ENV_FILE:-.env}
    networks:
      - fossil-network

networks:
  fossil-network:
    external: true
    name: fossil-network
