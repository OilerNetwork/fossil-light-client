name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches: ['main', 'sepolia-deployment']
    # Allow manual trigger
  workflow_dispatch:
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host light-client\n    HostName 3.237.238.67\n    User ubuntu\n    IdentityFile ~/.ssh/id_rsa" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ls -la ~/.ssh/
          ssh-keygen -l -f ~/.ssh/id_rsa

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to server
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no light-client '
            cd fossil-light-client && \
            # Get current image hash before pull
            CURRENT_HASH=$(docker inspect ametelnethermind/fossil-client:latest --format "{{.Id}}" 2>/dev/null || echo "") && \
            # Pull new image
            docker pull ametelnethermind/fossil-client:latest && \
            # Get new image hash
            NEW_HASH=$(docker inspect ametelnethermind/fossil-client:latest --format "{{.Id}}") && \
            # Only restart if hash changed or container doesn't exist
            if [ "$CURRENT_HASH" != "$NEW_HASH" ] || ! docker ps -q --filter name=fossil-client > /dev/null; then
              echo "New image detected or container not running. Restarting container..."
              # Stop the container first
              docker-compose -f docker-compose.client.yml down && \
              # Start with new image
              ENV_FILE=.env docker-compose -f docker-compose.client.yml up -d
            else
              echo "No new image detected. Skipping container restart."
            fi
          ' 