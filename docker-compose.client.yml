services:
  fossil-client:
    image: ametelnethermind/fossil-client:latest
    # image: fossil-client:latest
    container_name: fossil-client
    volumes:
      - ./:/app
    entrypoint: []
    command: >
      /bin/sh -c "
      client --env-file ${ENV_FILE:-/app/.env.docker} --polling-interval ${POLLING_INTERVAL:-60} ${START_BLOCK:+--start-block ${START_BLOCK}}
      "
    environment:
      - ETHEREUM_RPC_URL=http://anvil:8545
    env_file:
      - ${ENV_FILE:-.env}
    networks:
      - fossil-network

networks:
  fossil-network:
    external: true
    name: fossil-network
