[package]
name = "publisher"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
mmr-benchmark = []

[[bin]]
name = "build-mmr"
path = "bin/build_mmr.rs"

[[bin]]
name = "mmr-benchmark"
path = "bin/mmr_benchmark.rs"
required-features = ["mmr-benchmark"]

[dependencies]
clap = { workspace = true }
common = { path = "../common" }
guest-mmr = { path = "../guest-mmr" }
dotenv = { workspace = true }
eth-rlp-types = { workspace = true }
eth-rlp-verify = { workspace = true }
ethereum = { path = "../ethereum" }
eyre = { workspace = true }
garaga_rs = { workspace = true }
guest-types = { path = "../guest-types" }
ipfs-utils = { path = "../ipfs-utils" }
methods = { path = "../methods" }
mmr = { workspace = true }
mmr-utils = { path = "../mmr-utils" }
pyo3 = { workspace = true }
risc0-ethereum-contracts = { workspace = true }
risc0-zkvm = { version = "2.3.1", default-features = false, features = [
    "std",
    "unstable",
    "client",
    "bonsai",
] }
serde = { workspace = true }
sqlx = { workspace = true }
starknet-crypto = { workspace = true }
starknet-handler = { path = "../starknet-handler" }
store = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
hasher = { workspace = true }
mockall = { workspace = true }
starknet = { workspace = true }

[lib]
name = "publisher"
crate-type = ["cdylib", "rlib"]
