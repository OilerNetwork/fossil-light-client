[workspace]
resolver = "2"
members = [
    "crates/starknet-handler",
    "crates/client",
    "crates/relayer",
    "crates/common",
    "crates/methods",
    "crates/publisher",
    "crates/guest-types",
    "crates/ethereum",
    "crates/mmr-utils",
    "crates/guest-mmr",
    "crates/ipfs-utils",
    "crates/guest-fixed-utils",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Add this section to exclude methods from clippy checks
[workspace.metadata]
exclude-clippy = ["methods"]

# Always optimize; building and running the guest takes much longer without optimization.
[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true

[workspace.dependencies]
# External git dependencies - these seem necessary based on the project structure
eth-rlp-types = { git = "https://github.com/NethermindEth/eth-rlp-verify.git", package = "eth-rlp-types", rev = "6849b2460525d4749c4955ec8470951c6043ffce" }
eth-rlp-verify = { git = "https://github.com/NethermindEth/eth-rlp-verify.git", rev = "6849b2460525d4749c4955ec8470951c6043ffce" }
starknet = "0.16.0"
starknet-crypto = "0.7.4"
mmr = { git = "https://github.com/ametel01/rust-accumulators.git", branch = "feat/sha2-hasher" }
store = { git = "https://github.com/ametel01/rust-accumulators.git", branch = "feat/sha2-hasher" }
hasher = { git = "https://github.com/ametel01/rust-accumulators.git", branch = "feat/sha2-hasher", features = [
    "sha256",
] }
garaga_rs = { git = "https://github.com/ametel01/garaga.git", branch = "update-to-risc0-2.3.1" }
risc0-ethereum-contracts = { git = "https://github.com/risc0/risc0-ethereum", tag = "v2.2.2" }

# Core dependencies that are commonly used across crates
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls"] }
eyre = "0.6"
thiserror = "1.0"
secrecy = "0.8"
tracing = "0.1"
tokio = "1.47.1"
dotenv = "0.15"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = "1.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Ethereum/blockchain related
alloy = { version = "1.0", features = [
    "providers",
    "network",
    # "sol-types",
    "signer-local",
] }
alloy-contract = "1.0"
alloy-sol-types = { version = "1.0", features = ["json"] }

# Testing dependencies
mockall = "0.13"
tempfile = "3.17"

# Crypto and numeric dependencies
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes.git", tag = "sha2-v0.10.8-risczero.0", features = [
    'compress',
] }
num-bigint = "0.4"
num-traits = "0.2"
crypto-bigint = "0.5"

# Reliability and resilience
tokio-retry = "0.3"
backoff = "0.4"

# Other utilities
curl = "0.4.47"
hex = "0.4"
url = "2.5"
pyo3 = { version = "0.24", features = ["extension-module"] }

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes.git", tag = "sha2-v0.10.8-risczero.0" }
size-of = { path = "./size-of-patch" }
