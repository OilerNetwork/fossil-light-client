[profile.default]
src = "src"
out = "out"
libs = ["lib"]
ffi = true
fs_permissions = [
    { access = "read-write", path = "./logs" },
    { access = "read-write", path = "logs" },
    { access = "read-write", path = "logs/local_setup.json" },
    { access = "read", path = "./broadcast" },
]
