[package]
name = "verifier"
version = "0.1.0"
edition = "2024_07"

# See more keys and their definitions at https://docs.swmansion.com/scarb/docs/reference/manifest.html

[dependencies]
garaga = { git = "https://github.com/keep-starknet-strange/garaga.git", branch = "main" }
starknet.workspace = true
fossil_store = { path = "../store" }
openzeppelin_upgrades.workspace = true
openzeppelin_access.workspace = true

[dev-dependencies]
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true

[[target.starknet-contract]]
casm = true
casm-add-pythonic-hints = true
build-external-contracts = ["fossil_store::Store"]

[lib]
