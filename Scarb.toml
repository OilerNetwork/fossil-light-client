[workspace]
members = [
    "contracts/starknet/l1_message_proxy",
    "contracts/starknet/store",
    "contracts/starknet/verifier",
]

[workspace.dependencies]
starknet = "2.9.4"
assert_macros = "2.9.4"
snforge_std = "0.37.0"
openzeppelin_upgrades = "0.20.0"
openzeppelin_access = "0.20.0"

[dev-dependencies]
snforge_std.workspace = true

[[target.starknet-contract]]
casm = true
casm-add-pythonic-hints = true

[workspace.tool.fmt]
sort-module-level-items = true

[tool]
fmt.workspace = true

[lib]
casm = true

[cairo]
sierra-replace-ids = false
