[workspace]
members = [
    "contracts/starknet/l1_message_proxy",
    "contracts/starknet/store",
    "contracts/starknet/verifier",
]

[workspace.dependencies]
starknet = "2.11.4"
assert_macros = "2.11.4"
openzeppelin_upgrades = "2.0.0"
openzeppelin_access = "2.0.0"
snforge_std = "0.47.0"

[[target.starknet-contract]]
casm = true
casm-add-pythonic-hints = true

[workspace.tool.fmt]
sort-module-level-items = true

[tool]
fmt.workspace = true

[lib]
casm = true

[cairo]
sierra-replace-ids = false
